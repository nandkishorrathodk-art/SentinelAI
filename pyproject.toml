[project]
name = "sentinel-ai"
version = "0.1.0"
description = "SentinelAI — Living Neural Agentic Framework for Cybersecurity, Coding & Vision"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Nandkishor Rathod"}]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
vision = ["pillow", "torchvision"]
harvest = ["httpx", "openai", "anthropic", "google-generativeai"]
deploy = ["onnx", "openvino"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["sentinel/tests"]
asyncio_mode = "auto"

